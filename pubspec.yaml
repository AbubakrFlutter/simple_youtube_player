name: simple_youtube_player
description: A simple and easy-to-use YouTube video player widget for Flutter. Just provide a URL and size!
version: 0.0.1
homepage: https://github.com/AbubakrFlutter/simple_youtube_player

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0